<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Redirect stub replacing the old copy of the schedule page. The live
         version is on the Worker, where Cloudflare strips .html — hence the
         extensionless target. GitHub Pages does no such stripping, so this
         file must keep its .html name to catch the old inbound links. -->

    <title>LUMEN — All 21 free workshops, August 2026</title>
    <link rel="canonical" href="https://lumen-initiative.org/library-schedule">
    <meta http-equiv="refresh" content="0; url=https://lumen-initiative.org/library-schedule">
    <!-- Deliberately NO robots noindex here. A zero-delay meta refresh is read by
         Google as a redirect and passes ranking signals to the target; adding
         noindex muddies that, because it tells the crawler to drop the URL
         rather than follow it through. Redirect + canonical is the clean pair. -->

    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#05070f">

    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            display: grid;
            place-items: center;
            background: #05070f;
            color: #f4f6fb;
            font: 400 1rem/1.6 ui-sans-serif, -apple-system, system-ui, sans-serif;
            text-align: center;
            padding: 2rem;
        }
        a { color: inherit; }
        p { margin: 0 0 .5rem; }
        .muted { color: #f4f6fb99; font-size: .875rem; }
    </style>
</head>
<body>
    <main>
        <p>The workshop schedule has moved to <a href="https://lumen-initiative.org/library-schedule">lumen-initiative.org</a>.</p>
        <p class="muted">Redirecting you now&hellip;</p>
    </main>
    <script>
        // Belt-and-braces: fires before the meta refresh in most browsers, and
        // replace() keeps this stub out of the back-button history.
        location.replace('https://lumen-initiative.org/library-schedule');
    </script>
</body>
</html>
