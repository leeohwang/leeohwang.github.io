<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Redirect stub for the user-site repo ONLY. This file lives at the root
         of leeohwang.github.io and sends the bare domain to the real site.
         Project pages (leeohwang.github.io/genevayor, /tally, ...) are served
         from their own repos and are NOT affected by this file.

         Do NOT add a CNAME file to this repo to achieve the redirect: setting a
         custom domain on a user site makes GitHub redirect every project page
         to that domain too, which would break /genevayor. -->

    <title>LUMEN Initiative</title>
    <link rel="canonical" href="https://lumen-initiative.org/">
    <meta http-equiv="refresh" content="0; url=https://lumen-initiative.org/">
    <!-- Deliberately NO robots noindex here. A zero-delay meta refresh is read by
         Google as a redirect and passes ranking signals to the target; adding
         noindex muddies that, because it tells the crawler to drop the URL
         rather than follow it through. Redirect + canonical is the clean pair. -->

    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#05070f">

    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            display: grid;
            place-items: center;
            background: #05070f;
            color: #f4f6fb;
            font: 400 1rem/1.6 ui-sans-serif, -apple-system, system-ui, sans-serif;
            text-align: center;
            padding: 2rem;
        }
        a { color: inherit; }
        p { margin: 0 0 .5rem; }
        .muted { color: #f4f6fb99; font-size: .875rem; }
    </style>
</head>
<body>
    <main>
        <p>The LUMEN Initiative has moved to <a href="https://lumen-initiative.org/">lumen-initiative.org</a>.</p>
        <p class="muted">Redirecting you now&hellip;</p>
    </main>
    <script>
        // Belt-and-braces: fires before the meta refresh in most browsers, and
        // replace() keeps this stub out of the back-button history.
        location.replace('https://lumen-initiative.org/');
    </script>
</body>
</html>
